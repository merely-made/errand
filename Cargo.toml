[workspace]
resolver = "2"
members = [
    "crates/misfin",
    "crates/spartan-protocol",
    "crates/nex-protocol",
    "crates/guppy-protocol",
    "crates/gopher-protocol",
    "crates/finger-protocol",
    "crates/gemini-protocol",
    "crates/kepler-protocol",
    "crates/dict-protocol",
    "crates/fsp-protocol",
    "crates/scroll-protocol",
    "crates/text-protocol",
    "crates/scorpion-protocol",
]

[workspace.package]
# Minimum supported Rust version. These crates are meant to be depended on by
# people outside this workspace, so the number is a promise and CI holds it:
# the `msrv` job builds and tests the whole workspace on exactly this toolchain.
#
# 1.88 is measured, not chosen. Below it the build fails on two independent
# counts: `time` (through misfin's TLS lane) declares 1.88 itself, and the
# protocol crates use let-chains, stabilized in 1.88. 1.85, the edition-2024
# floor, was tried first and fails on all four crates.

rust-version = "1.97.1"
