[package]
name = "gopher-protocol"
version = "0.2.0"
edition = "2024"

rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/merely-made/smolweb"
description = "An implementation of the Gopher protocol (gopher://) and its Gopher+ successor: async client, RFC 1436 menu parser with RFC 4266 URLs, and Gopher+ attribute blocks, alternate views, and ASK forms. The parser half has no dependencies."
keywords = ["gopher", "gopher-plus", "smolweb", "protocol", "gemini"]
categories = ["network-programming"]
readme = "README.md"

[features]
# The menu parser is dep-free and always compiled. The client is the only
# thing that needs tokio + url, so a consumer that merely renders a gophermap
# (a viewer, a card, a static-site tool) can take this crate with
# `default-features = false` and pull no async runtime at all.
default = ["client"]
client = ["dep:tokio", "dep:url"]
# Serving is the same wire protocol read in the other direction, and answers
# both generations. Off by default: a client must not carry listeners.
server = ["dep:tokio", "dep:log", "tokio/rt", "tokio/time", "tokio/macros"]
# gophers://: the identical wire inside TLS on the same port 70. There is no
# formal spec; the scheme, port, and TLS-wrap are implemented per
# interoperating practice (michael-lazar/smolnet-portal proxies it this way).
tls = ["client", "dep:rustls", "dep:tokio-rustls"]

[dependencies]
url = { version = "2.5", optional = true }
tokio = { version = "1", default-features = false, features = [
    "net",
    "io-util",
], optional = true }
log = { version = "0.4", optional = true }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
], optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
] }
