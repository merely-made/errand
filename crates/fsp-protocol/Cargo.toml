[package]
name = "fsp-protocol"
version = "0.1.0"
edition = "2024"

rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/merely-made/smolweb"
description = "An implementation of the FSP protocol (File Service Protocol, fsp://): async UDP client and v2 wire format. Anonymous file transfer simple enough for embedded devices, with its own sequencing and checksums."
keywords = ["fsp", "file-transfer", "udp", "protocol", "smolweb"]
categories = ["network-programming"]
readme = "README.md"

[features]
# The wire format is dep-free and always compiled; the client needs a runtime.
default = ["client"]
client = ["dep:tokio"]

[dependencies]
tokio = { version = "1", default-features = false, features = [
    "net",
    "time",
], optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
    "time",
    "net",
] }
