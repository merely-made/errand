[package]
rust-version = "1.97.1"
name = "errand"
version = "0.4.0"
edition = "2024"
license = "MPL-2.0"
description = "Async small-web (smolweb) transport: gemini, gopher, finger, spartan, nex, guppy, and titan in one scheme-routed fetch, plus titan-upload and misfin-send write companions. Bytes in, bytes out, no HTTP, host-agnostic."
repository = "https://github.com/merely-made/errand"
publish = true
keywords = [
    "gemini",
    "gopher",
    "smolweb",
    "nex",
    "guppy",
]
categories = [
    "network-programming",
]
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
default = []
serve = [
    "gemini-protocol/server",
    "gopher-protocol/server",
    "finger-protocol/server",
]

[dependencies]
url = "2.5"
quick-xml = "0.39"
tracing = "0.1"

[dependencies.guppy-protocol]
workspace = true

[dependencies.spartan-protocol]
workspace = true

[dependencies.nex-protocol]
workspace = true

[dependencies.gopher-protocol]
workspace = true

[dependencies.finger-protocol]
workspace = true

[dependencies.gemini-protocol]
workspace = true

[dependencies.scroll-protocol]
workspace = true

[dependencies.misfin]
workspace = true
default-features = false
features = [
    "client",
    "ring",
]

[dependencies.tokio]
version = "1"
default-features = false
features = [
    "net",
    "io-util",
    "time",
]

[dependencies.rustls]
version = "0.23"
default-features = false
features = [
    "ring",
    "std",
    "tls12",
]

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = [
    "ring",
    "tls12",
]

[dev-dependencies.tokio]
version = "1"
default-features = false
features = [
    "rt",
    "macros",
    "net",
    "io-util",
    "sync",
]

[dev-dependencies.rcgen]
version = "0.13"
