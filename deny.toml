# cargo-deny configuration for errand.
#
#   cargo deny check bans
#
# Two versions of one crate in a build are a defect: move the older version's
# holder forward. No duplicates: latest releases, or a skip below saying who
# holds the older one and what removes it (Mark, 2026-11-12). One entry per
# older version; delete an entry when its holder moves, and
# `cargo deny check bans` will name any that no longer match.

[graph]
all-features = true

[bans]
multiple-versions = "deny"
wildcards = "allow"

[[bans.skip]]
crate = "getrandom@0.2.17"
reason = "held by ring 0.17.14 (its latest release); gone when ring moves to getrandom 0.4.3"

[[bans.skip]]
crate = "syn@2.0.119"
reason = "held by asn1-rs-derive 0.6.0, asn1-rs-impl 0.2.0 and synstructure 0.13.2 (asn1-rs 0.7.2 under x509-parser 0.18.1, both latest releases; asn1-rs 0.8 is a beta) and tracing-attributes 0.1.31 (its latest release); gone when those move to syn 3"

[[bans.skip]]
crate = "synstructure@0.13.2"
reason = "held by asn1-rs-derive 0.6.0 (asn1-rs 0.7.2 under misfin's x509-parser 0.18.1, both latest releases; asn1-rs 0.8 is a beta); gone when x509-parser takes asn1-rs 0.8"

[[bans.skip]]
crate = "windows-sys@0.52.0"
reason = "held by ring 0.17.14 (its latest release); gone when ring moves to windows-sys 0.61.2"
